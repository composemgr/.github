name: example
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: nginx:latest
    container_name: example-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: example-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
    volumes:
      - './volumes/data/example:/data:z'
      - './volumes/config/example:/config:z'
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.example-app.entrypoints=http'
      - 'traefik.http.routers.example-app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.example-app.middlewares=example-app-https-redirect'
      - 'traefik.http.middlewares.example-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.example-app-secure.entrypoints=https'
      - 'traefik.http.routers.example-app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.example-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.example-app-secure.service=example-app'
      - 'traefik.http.services.example-app.loadbalancer.server.port=80'
    networks:
      - example
      - traefik

networks:
  example:
    name: example
    external: false
  traefik:
    external: true
